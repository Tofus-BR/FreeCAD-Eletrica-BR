[project]
name = "eletrica-br"
version = "0.0.1"
description = "Projeto de instalações elétricas e automação residencial pelo padrão brasileiro, para o FreeCAD"
requires-python = ">=3.11"
license = "LGPL-3.0-or-later"
authors = [{ name = "Andrew Steven", email = "tofus.automacao@gmail.com" }]
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
  "E", "W", "F",      # pycodestyle e pyflakes
  "I",                # ordem dos imports
  "B",                # bugs comuns (bugbear)
  "UP",               # sintaxe atual do Python
  "SIM",              # simplificações
  "C4",               # comprehensions
  "C90",              # complexidade
  "PL",               # pylint (tamanho de função, argumentos, números mágicos)
  "RUF",              # regras do próprio Ruff
  "T20",              # print esquecido
  "BLE",              # except Exception genérico
  "ERA",              # código comentado
  "PIE", "RET", "ARG", "PTH",
]
ignore = ["RUF001", "RUF002", "RUF003"]  # acentos e símbolos do português são intencionais

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
max-args = 6
max-branches = 12

[tool.ruff.lint.per-file-ignores]
"testes/**" = ["PLR2004", "ARG"]   # teste compara com número de referência

[tool.pytest.ini_options]
testpaths = ["testes"]
addopts = "-q --strict-markers"
